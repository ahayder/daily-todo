name: release-macos

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-macos:
    env:
      NEXT_PUBLIC_POCKETBASE_URL: ${{ vars.NEXT_PUBLIC_POCKETBASE_URL }}
      NEXT_PUBLIC_REQUIRE_EMAIL_VERIFICATION: ${{ vars.NEXT_PUBLIC_REQUIRE_EMAIL_VERIFICATION }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 8.7.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync desktop version metadata
        run: pnpm version:sync

      - name: Run tests
        run: pnpm test

      - name: Validate PocketBase configuration
        run: |
          if [ -z "$NEXT_PUBLIC_POCKETBASE_URL" ]; then
            echo "NEXT_PUBLIC_POCKETBASE_URL is not configured." >&2
            echo "Add it as a GitHub Actions repository variable before tagging a release." >&2
            exit 1
          fi

      - name: Validate updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not configured." >&2
            echo "Releases without updater signing publish app bundles but break in-app updates." >&2
            exit 1
          fi

      - name: Build and publish macOS release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DailyTodoApp v__VERSION__
          releaseBody: |
            Personal macOS release for DailyTodoApp.
            Gatekeeper may ask you to approve the app manually because this build is not notarized.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          includeUpdaterJson: true
          args: --target ${{ matrix.target }} --bundles app,dmg --ci

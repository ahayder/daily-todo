<!doctype html>
<!--
  ui-ux-pro direction comparison. Copy to .design/directions/index.html and list the direction files below.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Design directions</title>
<script>
window.DIRECTIONS = [
  {
    "file": "A-night-lagoon.html",
    "id": "A",
    "name": "Night Lagoon",
    "oneLiner": "Deep ink-teal water at night with one mint light: the calmest page to start from, evolved from today's teal."
  },
  {
    "file": "B-pocket-stickers.html",
    "id": "B",
    "name": "Pocket Stickers",
    "oneLiner": "A plum night notebook with pastel sticker tabs: Tiimo-friendly color that makes today feel light and doable."
  },
  {
    "file": "B2-pocket-stickers-deep.html",
    "id": "B2",
    "name": "Pocket Stickers — Deep",
    "oneLiner": "B after feedback: the same pastel stickers, washi tape and ring timer on a near-black plum page — A's depth, B's friendliness."
  },
  {
    "file": "C-highlighter.html",
    "id": "C",
    "name": "Highlighter",
    "oneLiner": "A graphite dot-grid journal and a pack of highlighters: the most notebook, the most focused — one lime stroke marks what matters now."
  }
];
window.PRODUCT = "DailyTodo";
</script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f5; --fg: #18181b; --muted: #6b6b70; --line: #e4e4e2; --card: #fff;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131315; --fg: #f4f4f5; --muted: #a1a1aa; --line: #2a2a2e; --card: #1b1b1e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); }
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 16px 24px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 2; }
  h1 { font-size: 16px; font-weight: 600; margin: 0; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; font-size: 13px; }
  .seg button { all: unset; cursor: pointer; padding: 4px 12px; border-radius: 999px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .seg button:focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }
  main { display: grid; grid-template-columns: repeat(var(--cols), minmax(360px, 1fr)); gap: 16px; padding: 16px; overflow-x: auto; }
  .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .col .head { display: flex; align-items: baseline; gap: 10px; }
  .col .id { font-family: ui-monospace, monospace; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); }
  .col h2 { font-size: 15px; margin: 0; font-weight: 600; }
  .col p { margin: 0; font-size: 13px; color: var(--muted); }
  .col a { font-size: 13px; color: inherit; }
  iframe { width: 100%; height: calc(100vh - 150px); border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } iframe { height: 80vh; } }
</style>
</head>
<body>
<header>
  <h1 id="title">Design directions</h1>
  <p>Dark-first. Pick one, or mix: “A's colors with C's type”.</p>
  <span class="spacer"></span>
  <div class="seg" aria-label="Theme">
    <button type="button" data-theme="light" aria-pressed="false">Light</button>
    <button type="button" data-theme="dark" aria-pressed="true">Dark</button>
  </div>
</header>
<main id="cols"></main>
<script>
(() => {
  const list = window.DIRECTIONS || [];
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  document.getElementById("title").textContent = `${window.PRODUCT ? window.PRODUCT + " — " : ""}design directions`;
  const main = document.getElementById("cols");
  main.style.setProperty("--cols", Math.max(1, list.length));
  main.innerHTML = list.map((d) => `
    <div class="col">
      <div class="head"><span class="id">${esc(d.id)}</span><h2>${esc(d.name)}</h2><span style="flex:1"></span><a href="${esc(d.file)}" target="_blank" rel="noopener">Open full page</a></div>
      <p>${esc(d.oneLiner)}</p>
      <iframe src="${esc(d.file)}?embed=1" title="Direction ${esc(d.id)}: ${esc(d.name)}" loading="lazy"></iframe>
    </div>`).join("");
  document.querySelectorAll("[data-theme]").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll("[data-theme]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    document.querySelectorAll("iframe").forEach((f) => f.contentWindow && f.contentWindow.postMessage({ theme: b.dataset.theme }, "*"));
  }));
})();
</script>
</body>
</html>
